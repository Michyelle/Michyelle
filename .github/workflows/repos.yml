name: Update README with latest repos

on:
  schedule:
    - cron: "0 */8 * * *"   # every 8 hours
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch latest repositories
        id: fetch
        run: |
          echo "REPOS_TABLE=$(curl -s "https://api.github.com/users/Michyelle/repos?per_page=5&sort=updated" \
            | jq -r '.[] | "| [\(.name)](https://github.com/Michyelle/\(.name)) | \(.description // "-") |"' \
            | tr '\n' '§')" >> $GITHUB_ENV

      - name: Update README
        run: |
          repos=$(echo "$REPOS_TABLE" | tr '§' '\n')

          # Replace section in README
          sed -i "/<!--START_SECTION:repos-->/,/<!--END_SECTION:repos-->/c\<!--START_SECTION:repos-->\n| Project | Description |\n| ------- | ----------- |\n$repos\n<!--END_SECTION:repos-->" README.md

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update latest repos"
            git push
          else
            echo "No changes to commit"
          fi
